# Z-Matrix Operaton image (fork-only, S1-02 #11): builds platform/infra/operaton for amd64 + arm64 and publishes it to GHCR.
# Tags: 2.1.5-zm.<run number> (what OPERATON_IMAGE points at) and sha-<short commit>. Bump "2.1.5" together with the Dockerfile's FROM.
name: Z-Matrix Operaton image

on:
  push:
    branches: [main]
    paths:
      - 'platform/infra/operaton/**'
      - '.github/workflows/zm-operaton-image.yml'

permissions: {}

concurrency:
  group: zm-operaton-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ghcr.io/adityashandilya555/zm-operaton
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/adityashandilya555/zm-operaton
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:2.1.5-zm.$GITHUB_RUN_NUMBER"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/infra/operaton
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
