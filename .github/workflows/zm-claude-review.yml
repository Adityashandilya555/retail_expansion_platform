# Automatic Claude review of platform PRs (fork-only). Never pull_request_target: fork PRs get no secrets and are skipped.
name: Z-Matrix Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'platform/**'
      - '.github/workflows/zm-*.yml'

permissions: {}

concurrency:
  group: zm-claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # one tracking comment per PR, updated on every push; it carries the summary
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            1. Read `platform/AGENTS.md` and review the diff against its conventions.
            2. Find the linked issue (`Closes #<n>` in the PR body, or the leading number of the branch name)
               and read it with `gh issue view <n> --repo ${{ github.repository }}`. Check every acceptance
               criterion: met, not met, or not verifiable from the diff.
            3. Cover correctness, security (client isolation: client id only from the JWT, cross-client
               reads return 404; no secrets in code, logs or docs) and tests (each acceptance criterion
               has a test).

            Post an inline comment for each concrete problem with
            `mcp__github_inline_comment__create_inline_comment`. Put one short summary in your tracking
            comment: verdict, acceptance-criteria checklist, blocking problems. Do not push commits.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 20 --strict-mcp-config
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
