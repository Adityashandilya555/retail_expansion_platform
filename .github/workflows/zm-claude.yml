# Claude on demand (fork-only): a collaborator writes `@claude …` on an issue or PR.
# Claude pushes a branch `<issue#>-<slug>` and links PR creation; a person opens the PR.
name: Z-Matrix Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    name: "@claude"
    # Event text is only read here, never in `run:` (zizmor template-injection).
    # author_association sits at a different path per event; the action re-checks write access itself.
    if: >-
      (contains(fromJSON('["issue_comment","pull_request_review_comment"]'), github.event_name) && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: ""
          branch_name_template: "{{entityNumber}}-{{description}}"
          # --strict-mcp-config: only the action's own MCP servers, nothing from .mcp.json
          claude_args: "--model claude-opus-5-5 --max-turns 40 --strict-mcp-config"
