# Z-Matrix platform CI (fork-only). Operaton itself is covered by build.yml / pr-build.yml.
# Jobs switch on as code appears (detected by the guard job): Python + integration when platform/**/pyproject.toml exists, web when platform/**/package.json exists.
name: Z-Matrix Platform

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/zm-*.yml'
  push:
    # main only: a promotion PR into release (D16, platform/docs/ENVIRONMENTS.md) runs this as a
    # pull_request, and a push trigger on release would make zizmor treat the caches as poisonable
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/zm-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zm-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard + detect projects
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.detect.outputs.python }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No secrets committed
        run: |
          if git ls-files platform | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env file committed under platform/"; exit 1; fi
      - name: Detect Python / web projects
        id: detect
        run: |
          echo "python=$( [ -n "$(git ls-files 'platform/**/pyproject.toml')" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "web=$( [ -n "$(git ls-files 'platform/**/package.json')" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  python:
    name: Python (ruff + pytest)
    needs: guard
    if: needs.guard.outputs.python == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      # One sync at the uv workspace root covers every member (apps/*, packages/*).
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      # workflow.json schema (#16): the committed JSON Schema must match the Pydantic models.
      - name: workflow.schema.json up to date
        run: uv run zm-schema export --check
      # API client (#21): the committed packages/api-client/openapi.json must match the API.
      - name: openapi.json up to date
        run: uv run zm-api openapi --check
      - name: Test (unit; integration runs in zm-integration)
        run: uv run pytest --cov --cov-report=xml:coverage.xml
      # sonar-project.properties keeps platform/ as the common root of the uploaded paths (see #70).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: |
            platform/coverage.xml
            platform/sonar-project.properties
          if-no-files-found: ignore

  web:
    name: Web (tsc + eslint + vitest)
    needs: guard
    if: needs.guard.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # pnpm version comes from platform/package.json "packageManager".
      - run: corepack enable && pnpm install --frozen-lockfile
      # workflow.json schema (#16): the committed TS types must match workflow.schema.json.
      - name: Generated TS types up to date
        run: pnpm --filter @zm/schema gen && git diff --exit-code -- packages/schema/ts
      # API client (#21): the generated TS client must match the committed openapi.json.
      - name: API client up to date
        run: pnpm --filter @zm/api-client gen && git diff --exit-code -- packages/api-client
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # #20: the client app's production build leaves out /dev/ui, uses no Google Fonts, JS ≤ 300 kB gzip.
      - name: Client app build check
        run: pnpm --filter @zm/web build && pnpm --filter @zm/web check:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: |
            platform/**/coverage/lcov.info
            platform/sonar-project.properties
          if-no-files-found: ignore

  # Local stack smoke test: Supabase CLI Postgres (pilot vault) + docker compose, then pytest -m integration.
  zm-integration:
    name: Integration (compose + Supabase CLI)
    needs: guard
    if: needs.guard.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: uv sync --all-packages --frozen
      # Only Postgres is needed here; the other Supabase services stay off to save minutes.
      - name: Start the Supabase CLI vault (db only)
        run: >-
          supabase --workdir infra start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Migrate the client vaults
        run: |
          docker compose up -d --wait pg-iso
          ZM_ENGINE_DB_PASSWORD=zm-engine-local ZM_API_DB_PASSWORD=zm-api-local \
            uv run zm-worker vault-migrate --dsn postgresql://postgres:postgres@localhost:54322/postgres
          # qsr-local has its own credentials (#31): the compose defaults for operaton-iso
          ZM_ENGINE_DB_PASSWORD=zm-engine-iso-local ZM_API_DB_PASSWORD=zm-api-iso-local \
            uv run zm-worker vault-migrate --dsn postgresql://postgres:postgres@localhost:5434/postgres
      - name: Start the compose stack
        run: docker compose up -d --build --wait
      - name: Integration tests
        run: uv run pytest -m integration -v --cov --cov-report=xml:coverage-integration.xml
      # Code that needs a real database (vault migrations, registry) is only covered here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: |
            platform/coverage-integration.xml
            platform/sonar-project.properties
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 200

  # Isolation suite v1 (#31): two local clients can't reach each other, plus the PR-time
  # compatibility check (D14). Only the databases and the two engines are needed.
  zm-isolation:
    name: Isolation (two local clients) + compat
    needs: guard
    if: needs.guard.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: uv sync --all-packages --frozen
      - name: Compatibility check (templates + synthetic releases)
        run: uv run zm-compat --fixtures
      - name: Start the Supabase CLI vault (db only)
        run: >-
          supabase --workdir infra start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Migrate the client vaults, each with its own credentials
        run: |
          docker compose up -d --wait pg-iso
          ZM_ENGINE_DB_PASSWORD=zm-engine-local ZM_API_DB_PASSWORD=zm-api-local \
            uv run zm-worker vault-migrate --dsn postgresql://postgres:postgres@localhost:54322/postgres
          ZM_ENGINE_DB_PASSWORD=zm-engine-iso-local ZM_API_DB_PASSWORD=zm-api-iso-local \
            uv run zm-worker vault-migrate --dsn postgresql://postgres:postgres@localhost:5434/postgres
      - name: Start the platform database and both engines
        run: docker compose up -d --wait pg-platform pg-iso operaton-pilot operaton-iso
      - name: Isolation suite
        run: uv run pytest -m isolation -v --cov --cov-report=xml:coverage-isolation.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-isolation
          path: |
            platform/coverage-isolation.xml
            platform/sonar-project.properties
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 200

  # SonarQube Cloud: quality, PR decoration and security analysis of platform/ (config: platform/sonar-project.properties).
  # Runs after the test jobs (even when they are skipped) so it can pick up their `coverage` artifact once they upload one.
  sonar:
    name: SonarQube Cloud (platform/)
    needs: [guard, python, web, zm-integration, zm-isolation]
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage reports (if the test jobs produced any)
        if: needs.python.result == 'success' || needs.web.result == 'success' || needs.zm-integration.result == 'success' || needs.zm-isolation.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: coverage-*
          merge-multiple: true
          # Artifacts are rooted at platform/ (their common ancestor), so they unpack into the scan's base dir.
          path: platform
      - name: Scan
        # SONAR_TOKEN is absent on PRs from forks; the scan skips itself there.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: platform
