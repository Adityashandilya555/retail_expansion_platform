# SonarQube Cloud analysis of platform/ only (CI-based, run by .github/workflows/zm-platform.yml with projectBaseDir=platform).
# Operaton itself is not analysed here; see platform/docs/FORK.md.
# Org key (not the display name): you belong to two orgs both shown as "ADITYA SHANDILYA"; the project is in -1.
sonar.organization=adityashandilya555-1
sonar.projectKey=Adityashandilya555_retail_expansion_platform

# Paths are relative to platform/. Tests are indexed separately, so they are excluded from sources.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx
sonar.exclusions=prototype/**,**/node_modules/**,**/dist/**,**/.venv/**,packages/schema/ts/**,packages/api-client/**,**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

sonar.python.version=3.12
# Coverage files are produced by the python and web jobs (wired in S1-01, #9); missing files only mean "no coverage yet".
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
