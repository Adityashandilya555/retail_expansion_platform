[project]
name = "zm-schema"
version = "0.1.0"
description = "workflow.json schema v1: Pydantic models + JSON Schema (S1-07)"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23", "pydantic>=2.11"]

[project.scripts]
zm-schema = "zm_schema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zm_schema"]
