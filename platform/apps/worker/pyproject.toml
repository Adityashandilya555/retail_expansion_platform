[project]
name = "zm-worker"
version = "0.0.0"
description = "Z-Matrix worker: provisioning, reconciler, notifications"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.3", "zm-api"]

[tool.uv.sources]
zm-api = { workspace = true }

[project.scripts]
zm-worker = "zm_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zm_worker"]
