[project]
name = "zm-api"
version = "0.0.0"
description = "Z-Matrix platform API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.143", "uvicorn[standard]>=0.54"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zm_api"]
