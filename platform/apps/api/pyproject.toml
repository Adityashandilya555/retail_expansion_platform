[project]
name = "zm-api"
version = "0.0.0"
description = "Z-Matrix platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "cryptography>=44",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54",
    "zm-compiler",
    "zm-schema",
]

[project.scripts]
zm-api = "zm_api.cli:main"

[tool.uv.sources]
zm-compiler = { workspace = true }
zm-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zm_api"]
